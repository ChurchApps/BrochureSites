<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page Not Found | FreePlay</title>
  <link rel="icon" type="image/png" href="/images/logos/fp-icon.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; text-align: center; color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 30% 20%, #4a1942 0%, #2d1b3d 55%, #120a18 100%);
    }
    main { max-width: 32rem; }
    img { height: 2.5rem; width: auto; margin-bottom: 2rem; }
    h1 { font-size: 2rem; margin: 0 0 .75rem; }
    p { color: rgba(255,255,255,.8); line-height: 1.6; margin: 0 0 2rem; }
    a.btn {
      display: inline-block; padding: 14px 32px; border-radius: 9999px; background: #ec008c;
      color: #fff; font-weight: 600; text-decoration: none;
    }
    a.btn:hover { background: #ff1a9e; }
    .links { margin-top: 1.5rem; font-size: .95rem; }
    .links a { color: rgba(255,255,255,.85); }
  </style>
</head>
<body>
  <main>
    <a href="/"><img src="/images/logos/freeplay-white-512.png" alt="FreePlay" width="512" height="128" /></a>
    <h1>Page not found</h1>
    <p>That page doesn't exist. FreePlay is the free TV app for church curriculum on Apple TV, Fire TV, and Android TV.</p>
    <a class="btn" href="/">Go to the FreePlay home page</a>
    <div class="links">
      <a href="https://support.churchapps.org/docs/freeplay/">FreePlay help docs</a>
    </div>
  </main>
</body>
</html>
