        <h1>FreePlay — Free Church Curriculum for TV</h1>
        <p>The future of church curriculum has arrived. FreePlay is a free TV app that lets churches stream curriculum, sermons, and media content directly to Apple TV, Amazon Fire TV, and Android TV.</p>

        <h2>How It Works</h2>
        <p>Download FreePlay on your TV, connect to your church's content through Lessons.church, and start playing — it's that simple. Download lessons and play offline with just a remote.</p>

        <h2>Features</h2>
        <ul>
          <li>Works on Apple TV, Amazon Fire TV, and Android TV</li>
          <li>Stream church curriculum to classroom TVs</li>
          <li>Download lessons for offline playback</li>
          <li>Perfect for kids ministry, youth groups, and adult classes</li>
          <li>100% free — no subscriptions, no hidden costs</li>
        </ul>

        <h2>About</h2>
        <p>FreePlay is provided by <a href="https://churchapps.org">Live Church Solutions</a>, a 501(c)(3) non-profit organization (EIN: 45-5349618). We exist to free the church from software costs so every church can focus on ministry and making disciples.</p>
        <p>"Freely you have received; freely give." — Matthew 10:8</p>
