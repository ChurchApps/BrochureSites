<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="free church app, church management software, church website builder, digital giving, church platform, church communication, church check-in, church community" />
    <meta name="author" content="B1 Church" />
    <meta name="robots" content="index, follow" />
    <!-- Per-page <title>, description, canonical, and og/twitter title+description
         are set by the <Seo> component (src/components/Seo.tsx). Only constant,
         page-independent defaults live here. -->

    <!-- Open Graph / Facebook (defaults) -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://b1.church/b1-church-logo.png" />
    <meta property="og:image:alt" content="B1 Church - Free Church Platform Logo" />
    <meta property="og:site_name" content="B1 Church" />

    <!-- Twitter (defaults) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://b1.church/b1-church-logo.png" />
    <meta name="twitter:image:alt" content="B1 Church - Free Church Platform Logo" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "B1 Church",
      "url": "https://b1.church",
      "logo": "https://b1.church/b1-church-logo.png",
      "description": "100% free, open-source church management platform with a member app, website builder, digital giving, check-in, and community features.",
      "sameAs": [
        "https://churchapps.org",
        "https://github.com/ChurchApps"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "support@churchapps.org",
        "telephone": "+1-918-994-2638"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free church management platform"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "B1 Church Platform",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "100% free church management software, including hosting. People, giving, check-in, groups, website, and attendance. Open source from ChurchApps.",
      "features": [
        "Member Mobile App (PWA)",
        "Church Management (B1Admin)",
        "Digital Giving",
        "Self-Service Check-in",
        "Church Website Builder",
        "Sermon Management & Live Streaming",
        "Workflow Automation",
        "Bible Integration"
      ],
      "publisher": {
        "@type": "Organization",
        "name": "B1 Church"
      }
    }
    </script>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3RQGLEE47Y"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-3RQGLEE47Y');
    </script>

    <!-- Material Icons Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
